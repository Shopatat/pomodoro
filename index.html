<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D5382B">
<title>Pomodoro</title>
<meta name="description" content="Minuteur pomodoro façon minuteur de cuisine : une tomate qu'on tourne du doigt.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <nav class="modes" role="tablist" aria-label="Type de session">
    <button role="tab" data-mode="focus">Focus</button>
    <button role="tab" data-mode="short">Pause courte</button>
    <button role="tab" data-mode="long">Pause longue</button>
  </nav>
  <button class="icon-btn" id="openSettings" aria-label="Réglages" title="Réglages">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
</header>

<main>
  <div class="dial-wrap" id="dialWrap">
    <svg id="dial" viewBox="0 -24 400 424" tabindex="0" role="slider" aria-valuemin="1" aria-valuemax="120" aria-label="Temps restant. Flèches pour régler, Entrée pour lancer.">
      <defs>
        <radialGradient id="gShade" cx="50%" cy="50%" r="50%"><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></radialGradient>
        <radialGradient id="gGloss" cx="30%" cy="16%" r="62%"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".38" stop-color="#fff" stop-opacity=".12"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <linearGradient id="gKnob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient>
      </defs>
      <circle class="face" cx="200" cy="200" r="190"/>
      <circle class="shade" cx="200" cy="200" r="190"/>
      <circle class="arc-track" cx="200" cy="200" r="128"/>
      <circle class="arc" id="arc" cx="200" cy="200" r="128"/>
      <g id="scale">
        <g id="ticks"></g>
        <circle class="knob" cx="200" cy="200" r="106"/>
        <g id="ridges"></g>
      </g>
      <circle class="knob-light" cx="200" cy="200" r="106"/>
      <circle class="gloss" cx="200" cy="200" r="190"/>
      <rect class="stem" x="196" y="-21" width="8" height="15" rx="3"/>
      <path class="stem" id="sepals"/>
    </svg>
    <div class="readout" id="readout">
      <div class="digits" id="digits" aria-hidden="true"></div>
      <div class="sub" id="sub">Focus</div>
    </div>
  </div>

  <div class="controls">
    <button class="round" id="resetBtn" aria-label="Recommencer" title="Recommencer (R)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
    </button>
    <button class="main" id="startBtn">Démarrer</button>
    <button class="round" id="skipBtn" aria-label="Passer à la suite" title="Passer (S)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l9 7-9 7z" fill="currentColor"/><path d="M18.5 5v14"/></svg>
    </button>
  </div>

  <div class="dots" id="dots" role="img"></div>
  <input id="task" class="task" placeholder="Sur quoi tu bosses ?" maxlength="80" autocomplete="off">
  <button class="today" id="todayBtn" aria-label="Voir ton bilan" title="Ton bilan (B)">
    <span class="today-top"><span id="statsText"></span><span class="streak" id="streak"></span></span>
    <span class="goal"><i id="goalBar"></i></span>
  </button>
  <p class="hint" id="hint"></p>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Réglages">
  <div class="drawer-head"><h2>Réglages</h2><button class="close">Fermer</button></div>
  <div class="drawer-body" id="drawerBody">
    <nav class="set-nav" id="setNav" aria-label="Sections des réglages"></nav>
    <div id="settingsBody"></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="shortcuts">
      <kbd>Espace</kbd> lancer ou mettre en pause<br>
      <kbd>R</kbd> recommencer, <kbd>S</kbd> passer<br>
      <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> changer de mode<br>
      <kbd>,</kbd> réglages, <kbd>B</kbd> ton bilan<br>
      Flèches sur le cadran pour ajouter ou retirer une minute
    </div>
    <p class="signature">Une tomate à la fois 🍅</p>
  </div>
</aside>
<aside class="drawer" id="bilan" aria-label="Ton bilan">
  <div class="drawer-head"><h2>Ton bilan</h2><button class="close">Fermer</button></div>
  <div class="drawer-body" id="bilanBody"></div>
</aside>

<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
